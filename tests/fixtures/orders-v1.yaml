openapi: 3.1.1
info:
  title: Orders API
  version: 1.0.0
  description: Fixture used by tests/test_contract_comparison.py (baseline contract).
servers:
  - url: https://api.example.com/v1
tags:
  - name: Orders
security:
  - oauth2: [orders:read]
paths:
  /orders:
    get:
      tags: [Orders]
      operationId: listOrders
      summary: List orders
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, SHIPPED, CANCELLED] }
      responses:
        '200':
          description: Page of orders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        '401':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Create order
      security:
        - oauth2: [orders:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '422':
          $ref: '#/components/responses/Problem'
  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Get order
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Orders]
      operationId: cancelOrder
      summary: Cancel order
      responses:
        '204':
          description: Cancelled
        '404':
          $ref: '#/components/responses/Problem'
  /health:
    get:
      tags: [Orders]
      operationId: health
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
        '503':
          description: Unavailable
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.com/token
          scopes:
            orders:read: Read
            orders:write: Write
            orders:admin: Admin
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
    OrderCreate:
      type: object
      required: [customerId, items]
      properties:
        customerId: { type: string, maxLength: 64 }
        note: { type: string, maxLength: 500 }
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/OrderItem' }
    OrderItem:
      type: object
      required: [sku, quantity]
      properties:
        sku: { type: string }
        quantity: { type: integer, minimum: 1 }
    Order:
      type: object
      required: [id, customerId, status, total]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string }
        status: { type: string, enum: [OPEN, SHIPPED, CANCELLED] }
        total: { type: string }
        trackingNumber: { type: string }
    OrderPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Order' }
