name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 (EOL Oct 2025) is no longer available on ubuntu-latest; the scripts remain
        # 3.9-compatible and are tested on 3.9 locally (see docs/validation-report.md).
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run test suite
        run: python -m pytest -v
      - name: Validate skill contracts and examples (strict where expected clean)
        run: |
          S=skills/api-architect-ai/scripts
          python $S/validate_openapi.py skills/api-architect-ai/assets/openapi-template.yaml --strict --external
          python $S/validate_openapi.py examples/api-design-example/openapi.yaml --strict --external
          python $S/validate_openapi.py examples/repository-review-example/sample-app/openapi.yaml
      - name: Breaking-change detector must flag the fixture
        run: |
          S=skills/api-architect-ai/scripts
          set +e
          python $S/compare_contracts.py tests/fixtures/orders-v1.yaml tests/fixtures/orders-v2.yaml
          code=$?
          set -e
          test "$code" -eq 1
      - name: Example JSON files parse
        run: |
          python -c "import json,sys; [json.load(open(p)) for p in sys.argv[1:]]" \
            skills/api-architect-ai/assets/quality-scorecard.json \
            examples/repository-review-example/assessment.json \
            examples/api-testing-example/postman/policies.postman_collection.json
          python -m py_compile examples/api-testing-example/pytest-suite/test_policies_api.py

  no-yaml:
    name: scripts without PyYAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JSON input works and YAML input exits 3 without PyYAML
        run: |
          S=skills/api-architect-ai/scripts
          python $S/calculate_score.py skills/api-architect-ai/assets/quality-scorecard.json
          set +e
          python $S/validate_openapi.py examples/api-design-example/openapi.yaml
          code=$?
          set -e
          test "$code" -eq 3
